<!-- ============================================
     COURSE CARD COMPONENT SNIPPET
     Paste inside .courses-grid in index.html
     data-category values: web | embedded | java | network
     ============================================ -->

<div class="course-card" data-category="web">

  <!-- Card Image Area (use background-image or a real <img>) -->
  <div class="course-img web-dev-img">
    <span class="course-badge trending">🔥 Trending</span>
  </div>

  <!-- Card Body -->
  <div class="course-body">

    <!-- Category Label -->
    <span class="course-tag">Web Development</span>

    <!-- Title -->
    <h3 class="course-title">Full Stack Development — MEAN / MERN Stack</h3>

    <!-- Meta: Hours + Level -->
    <div class="course-meta">
      <span><i class="fas fa-clock"></i> 160 Hours</span>
      <span><i class="fas fa-graduation-cap"></i> Beginner–Advanced</span>
    </div>

    <!-- Delivery Mode Tags -->
    <div class="course-modes">
      <span class="mode-tag">In-Centre</span>
      <span class="mode-tag">Online</span>
      <span class="mode-tag">Hybrid</span>
    </div>

    <!-- Card Footer: Placement + CTA -->
    <div class="course-footer">
      <span class="placement-tag">
        <i class="fas fa-check-circle"></i> Placement Support
      </span>
      <a href="#" class="btn btn-primary btn-sm">Know More →</a>
    </div>

  </div>
</div>
